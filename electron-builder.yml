# electron-builder config for electron-vite
# Based on electron-vite standard conventions
# Run with: pnpm dist

appId: com.lama.one
productName: LAMA

directories:
  buildResources: assets
  output: release

# Exclude source files, keep built output
# All dependencies are bundled by electron-vite, so exclude node_modules
files:
  - '!**/.vscode/*'
  - '!src/*'             # Source excluded, out/ included
  - '!electron/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig*.json}'
  - '!{*.md,*.log}'
  - '!tests/*'
  - '!specs/*'
  - '!scripts/*'
  - '!**/node_modules/**'  # Skip all node_modules (bundled by vite)

# Unpack resources that need filesystem access
asarUnpack:
  - resources/**
  - assets/**
  - out/main/bins/**  # node-llama-cpp native binaries

# Extra resources (not in asar)
extraResources:
  - from: assets
    to: assets
    filter: ["**/*"]
  - from: models
    to: models
    filter: ["**/*"]

# Windows
win:
  executableName: LAMA
  icon: assets/icons/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  artifactName: LAMA-${version}-setup.${ext}
  shortcutName: LAMA
  uninstallDisplayName: LAMA
  createDesktopShortcut: always
  oneClick: true
  perMachine: false

# macOS
mac:
  icon: assets/icons/icon.png
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist

dmg:
  artifactName: LAMA-${version}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Linux
linux:
  target:
    - AppImage
  icon: assets/icons
  category: Office
  maintainer: lama.one
  synopsis: Local AI Messaging Assistant

appImage:
  artifactName: LAMA-${version}-${arch}.${ext}

npmRebuild: false
buildDependenciesFromSource: false

# Disable publishing (build artifacts only)
publish: null
